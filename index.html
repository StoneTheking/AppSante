<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Ton coach santé personnel : sommeil, humeur, écrans, activité, nutrition par photo." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>AppSanté</title>
  </head>
  <body>
    <header class="top">
      <h1 id="title">Aujourd'hui</h1>
      <button id="install" class="chip" hidden>Installer</button>
    </header>
    <main id="view"></main>
    <nav class="tabs">
      <button data-tab="today"><span>🏠</span>Jour</button>
      <button data-tab="meals"><span>📸</span>Repas</button>
      <button data-tab="track"><span>📊</span>Suivi</button>
      <button data-tab="future"><span>🔮</span>Projection</button>
      <button data-tab="coach"><span>💬</span>Coach</button>
      <button data-tab="profile"><span>👤</span>Profil</button>
    </nav>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
